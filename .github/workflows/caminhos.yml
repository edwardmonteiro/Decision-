name: LUMI Caminhos
on:
  pull_request:
    paths: ['caminhos/**', '.github/workflows/caminhos.yml']
  push:
    paths: ['caminhos/**', '.github/workflows/caminhos.yml']
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check caminhos/app/src/main/assets/game.js
      - run: node caminhos/tests/physics.test.cjs
