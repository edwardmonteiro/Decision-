<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07121e"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>LUMI · Traçado</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
  <header><div class="brand">LUMI<span>TRAÇADO</span></div><div class="header-tools"><button id="map" class="track-button"><span id="track-label">PISTA 1 / 6</span><span data-icon="chevron"></span></button><button id="settings" class="icon circle" aria-label="Configurações"></button></div></header>
  <section class="intro"><h1 id="title">A primeira volta</h1><p>Desenhe uma volta. O carro segue sua linha.</p></section>
  <div id="board-wrap"><canvas id="board" aria-label="Desenhe uma linha na pista, começando e terminando na bandeira. Você pode continuar o desenho em vários movimentos."></canvas><div class="hud"><div><span>TEMPO</span><strong id="timer">0,0<span>s</span></strong></div><div id="drift-stat"><span>DRIFT</span><strong id="drift-time">—</strong></div></div><div id="paused" hidden>Em pausa</div><div id="track-kind">OVAL</div></div>
  <div id="feedback" role="status" aria-live="polite">Comece na bandeira e dê uma volta pela pista.</div>
  <div class="tools"><button id="undo"><span data-icon="undo"></span>Desfazer</button><button id="clear"><span data-icon="erase"></span><span id="clear-label">Apagar</span></button><button id="guide"><span data-icon="bulb"></span>Guia</button></div>
  <div id="modes" aria-label="Estilo de direção"><button data-mode="cruise">Passeio</button><button data-mode="race">Corrida</button><button data-mode="drift">Drift<span data-icon="slide"></span></button></div>
  <footer><button id="action" class="primary" disabled><span id="action-label">DESENHE UMA VOLTA</span><span id="action-icon" data-icon="play"></span></button><p id="footnote">Sua linha. Seu jeito de correr.</p></footer>
</main><div id="overlay" hidden><section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1"></section></div>
<script src="race.js"></script><script src="tracks.js"></script><script src="game.js"></script></body></html>
