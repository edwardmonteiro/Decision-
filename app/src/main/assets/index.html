<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07121e"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'"><title>LUMI · Travessias</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<header><span class="wordmark">LUMI</span><div class="header-tools"><button id="voice-toggle" class="voice-button" aria-label="Conversar com Lumi" aria-pressed="false"><span id="voice-icon"></span><span id="voice-label">Falar</span></button><button id="listen" class="icon" aria-label="Ouvir o desafio"></button><button id="settings" class="icon circle" aria-label="Configurações"></button></div></header>
<section id="voice-bar" class="hidden" aria-label="Conversa por voz"><div><strong id="voice-status">Lumi · voz de IA</strong><button id="voice-end" aria-label="Desligar microfone">Desligar ×</button></div><p id="voice-caption" aria-live="polite">Diga: “Fica de noite”.</p><button id="voice-play" class="hidden">Toque para ouvir a Lumi</button></section>
<button id="level-map" aria-label="Abrir mapa de níveis"><span id="level-label">1 · Primeiros passos</span><span id="level-stars" aria-label="0 de 3 estrelas">☆ ☆ ☆</span><span aria-hidden="true">›</span></button>
<section class="intro"><h1 id="title">Como<br>atravessar?</h1><p id="subtitle">Desenhe uma ideia. Veja acontecer.</p></section>
<section id="world-wrap" aria-label="Desafio de atravessar o rio"><canvas id="world"></canvas><span id="conditions">Rio estreito · água calma</span><span id="origin">Desafio local</span></section>
<section id="drawing-area"><div class="pad-heading"><span id="pad-label">✎ &nbsp;Seu desenho</span><button id="ideas">Ver ideias</button></div><canvas id="drawing" aria-label="Área para desenhar uma ponte, um barco ou um salto"></canvas><span id="draw-placeholder">Desenhe aqui com o dedo</span><div id="busy" class="hidden" role="status"><span class="spinner"></span><strong>Lendo sua ideia…</strong><span>Decisions está olhando o desenho.</span></div><div id="outcome" class="hidden" role="status"><div id="solution-icon"></div><h2 id="outcome-title"></h2><p id="outcome-description"></p><span id="level-reward"></span><span id="recognition"></span><button id="correct" class="text-button">Não era isso que desenhei</button></div></section>
<div id="drawing-tools"><button id="undo" aria-label="Desfazer último traço">↶ &nbsp;Desfazer</button><button id="clear" aria-label="Limpar desenho">⌫ &nbsp;Limpar</button></div>
<div id="feedback" role="status" aria-live="polite"></div>
<footer><button id="submit" class="primary">EXPERIMENTAR <span>→</span></button><button id="retry" class="secondary hidden">Tentar outro desenho</button><p id="footer-note">Desenhe uma ponte, um barco ou um salto.</p></footer>
<div id="overlay" class="hidden"><section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"></section></div>
</main><script src="levels.js"></script><script src="game.js"></script><script src="live-voice.js"></script></body></html>
